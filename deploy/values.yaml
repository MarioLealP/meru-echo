# echo's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: echo
owner: mario
image:
  repository: zot.clockmost.com/meru/echo
  digest: sha256:82d7e6f5f1e4f9fb7a695fee21a816ebe15f80b776f8f5b7765f3ee38f0aa852
  tag: "601b76defbea"

networkPolicy:
  enabled: true # only Caddy (from the node) gets in
  hostAddresses: [10.42.0.1/32] # the node: the kubelet's probes and Caddy on the host (no Docker range any more)
  egress: none
  toNamespaces: [openobserve] # OTLP traces (cm-id0n); OpenObserve's policy lets this namespace in
  toAddresses:
    - { cidr: 192.168.10.110/32, ports: [443] } # Caddy: GlitchTip

# Crash reports (D125): this app's GlitchTip project, which Shikigami made (it predates the marker's own DSN line).
glitchtip:
  dsn: https://a53d398ce358411fba50c2501f2f2184@glitchtip.clockmost.com/9

# Traces go to OpenObserve in-cluster (Service port 80 -> 5080; the SDK appends /v1/traces). The Basic-auth header comes
# from the request's `otel-exporter-otlp-headers` secret (OTEL_EXPORTER_OTLP_HEADERS), which Janus writes to OpenBao.
otel:
  endpoint: http://openobserve.openobserve.svc/api/default
